<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Sistem Pengontrolan Mahasiswa</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/global.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(
          135deg,
          #eff6ff 0%,
          #f8fafc 50%,
          #ecfeff 100%
        );
        font-family: Arial, sans-serif;
      }
      .auth-shell {
        width: min(540px, calc(100% - 24px));
      }
      .auth-card {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
        padding: 32px 28px;
      }
      .brand {
        text-align: center;
        margin-bottom: 20px;
      }
      .brand-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        font-weight: 900;
        font-size: 1.5rem;
        margin: 0 auto 12px;
      }
      .brand h2 {
        margin: 0 0 6px;
        font-size: 1.8rem;
      }
      .brand p {
        margin: 0;
        color: #64748b;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .form-group.full {
        grid-column: 1 / -1;
      }
      label {
        font-weight: 600;
        color: #1f2937;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d6dfef;
        background: #f8fbff;
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }
      .btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn-primary {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
      }
      .error-text {
        min-height: 22px;
        margin: 12px 0 0;
        text-align: center;
        color: #dc2626;
      }
      .auth-footer {
        margin-top: 16px;
        text-align: center;
        color: #475569;
      }
      .auth-footer a {
        color: #2563eb;
        font-weight: 700;
        text-decoration: none;
      }
      @media (max-width: 540px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark">SP</div>
          <h2>Buat Akun Baru</h2>
          <p>Sistem Pengontrolan Mahasiswa</p>
        </div>

        <form id="registerForm">
          <div class="form-grid">
            <div class="form-group full">
              <label for="name">Nama Lengkap</label>
              <input
                type="text"
                id="name"
                required
                placeholder="Nama lengkap"
              />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                required
                placeholder="nama@email.com"
              />
            </div>
            <div class="form-group">
              <label for="nim_nip">NIM / NIP</label>
              <input
                type="text"
                id="nim_nip"
                required
                placeholder="Contoh: 210401001 atau NIP123"
              />
            </div>
            <div class="form-group full">
              <label for="role">Role</label>
              <select id="role" required>
                <option value="mahasiswa">Mahasiswa</option>
                <option value="dosen">Dosen</option>
                <option value="dekan">Dekan</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="form-group full">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                required
                placeholder="********"
              />
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-primary"
            style="margin-top: 18px"
          >
            Daftar
          </button>
        </form>

        <p id="message" class="error-text"></p>

        <p class="auth-footer">
          Sudah punya akun? <a href="./login.html">Login di sini</a>
        </p>
      </div>
    </div>

    <script src="../../js/config.js"></script>
    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const payload = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            nim_nip: document.getElementById("nim_nip").value,
            role: document.getElementById("role").value,
            password: document.getElementById("password").value,
          };

          const message = document.getElementById("message");

          try {
            const response = await fetch(
              `${CONFIG.API_BASE_URL}/auth/register`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              },
            );

            const result = await response.json();
            message.textContent = result.message || "Akun berhasil dibuat.";

            if (response.ok) {
              setTimeout(() => {
                window.location.href = "./login.html";
              }, 1000);
            }
          } catch (error) {
            message.textContent = "Terjadi kesalahan saat mendaftar.";
          }
        });
    </script>
  </body>
</html>
