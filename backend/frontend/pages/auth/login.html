<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistem Pengontrolan Mahasiswa</title>
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/global.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(
          135deg,
          #dbeafe 0%,
          #eff6ff 50%,
          #ecfeff 100%
        );
        font-family: Arial, sans-serif;
      }
      .auth-shell {
        width: min(430px, calc(100% - 24px));
      }
      .auth-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
        padding: 32px 28px;
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 18px;
      }
      .brand-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        font-weight: 900;
        font-size: 1.5rem;
        margin-bottom: 12px;
      }
      .brand h2 {
        margin: 0 0 6px;
        font-size: 1.8rem;
      }
      .brand p {
        margin: 0;
        color: #64748b;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      label {
        font-weight: 600;
        color: #1f2937;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d6dfef;
        background: #f8fbff;
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
      }
      input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }
      .btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn-primary {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
      }
      .error-text {
        min-height: 22px;
        margin: 12px 0 0;
        text-align: center;
        color: #dc2626;
      }
      .auth-footer {
        margin-top: 18px;
        text-align: center;
        color: #475569;
      }
      .auth-footer a {
        color: #2563eb;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark">SP</div>
          <h2>Masuk Sistem</h2>
          <p>Sistem Pengontrolan Mahasiswa</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Kampus</label>
            <input
              type="email"
              id="email"
              required
              placeholder="nama@kampus.ac.id"
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              required
              placeholder="********"
            />
          </div>
          <button type="submit" class="btn btn-primary">Masuk</button>
        </form>

        <p id="errorMessage" class="error-text"></p>

        <p class="auth-footer">
          Belum punya akun? <a href="./register.html">Daftar sekarang</a>
        </p>
      </div>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const errorElement = document.getElementById("errorMessage");

          try {
            const response = await fetch(`${CONFIG.API_BASE_URL}/auth/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const result = await response.json();
            if (response.ok && result.success) {
              Utils.setToken(result.token);
              Utils.setUser(result.user);

              if (result.user.role === "admin") {
                window.location.href = "../admin/dashboard.html";
              } else if (result.user.role === "dekan") {
                window.location.href = "../dekan/dashboard.html";
              } else if (result.user.role === "dosen") {
                window.location.href = "../dosen/dashboard.html";
              } else {
                window.location.href = "../mahasiswa/dashboard.html";
              }
            } else {
              errorElement.textContent = result.message || "Login gagal.";
            }
          } catch (err) {
            errorElement.textContent = "Terjadi kesalahan koneksi ke server.";
          }
        });
    </script>
  </body>
</html>
